name: legacy-escape

services:
  legacy-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-legacy}
      POSTGRES_USER: ${POSTGRES_USER:-legacy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-legacy}
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - legacy-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Educación: lee la base directamente. NO SE PUEDE MODIFICAR.
  educacion-app:
    build: ./services/educacion
    env_file: .env
    ports:
      - "${EDUCACION_PORT:-8090}:8090"
    depends_on:
      legacy-db:
        condition: service_healthy

  # Portal de servicios: solo habla HTTP con GATEWAY_URL. NO SE PUEDE MODIFICAR.
  portal-client:
    build: ./services/portal
    env_file: .env
    ports:
      - "${PORTAL_PORT:-8092}:8092"

  # Subsidios: registra retiros. Con Afiliaciones en DUAL/MODERN va por el gateway;
  # en LEGACY (tras ./rollback.sh affiliations) vuelve al procedimiento legacy de siempre.
  subsidios-app:
    build: ./services/subsidios
    env_file: .env
    ports:
      - "${SUBSIDIOS_PORT:-8091}:8091"
    volumes:
      - ./config:/app/config:ro
    depends_on:
      legacy-db:
        condition: service_healthy

  # Gateway de Afiliaciones (puerto de contrato 8082). Único servicio nuevo que habla con legacy-db.
  gateway:
    build: ./src
    env_file: .env
    ports:
      - "8082:8082"
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config:ro
      - gateway-data:/app/data      # outbox durable de retiros (sobrevive reinicios)
    depends_on:
      legacy-db:
        condition: service_healthy
    restart: unless-stopped

  # App móvil (evento 3, nuevo consumidor): PWA de solo lectura. Solo HTTP al gateway con
  # MOBILE_TOKEN; no accede a la base de datos.
  mobile-app:
    build: ./services/mobile
    env_file: .env
    ports:
      - "8093:8093"
    depends_on:
      - gateway

  # Pruebas del equipo: solo HTTP contra el gateway (no accede a la base de datos).
  #   docker compose --profile test run --rm tests   -> JUnit en ./test-results/junit.xml
  tests:
    build: ./tests
    env_file: .env
    environment:
      GATEWAY_URL: http://gateway:8082
    profiles: ["test"]
    volumes:
      - ./test-results:/app/test-results
      - ./logs:/app/logs:ro
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  legacy-db-data:
  gateway-data:
